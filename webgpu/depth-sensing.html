<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Depth Sensing</title>
    <style>
      :root {
        --bg: #07131f;
        --panel: rgba(10, 20, 32, 0.72);
        --panel-border: rgba(143, 214, 255, 0.2);
        --text: #eef8ff;
        --muted: #9cc3db;
        --accent: #7ee7ff;
        --accent-2: #7c9cff;
        --shadow: rgba(28, 89, 146, 0.4);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(100, 180, 255, 0.2), transparent 36%),
          linear-gradient(180deg, #020912 0%, #07131f 100%);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #app {
        position: relative;
        width: min(100vw, 1200px);
        height: min(100vh, 760px);
        margin: 18px;
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        background: rgba(2, 8, 15, 0.82);
        box-shadow: 0 28px 80px var(--shadow);
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #050d16;
      }

      .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1;
        width: min(350px, calc(100% - 40px));
        padding: 18px 18px 16px;
        border-radius: 18px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2vw, 2.3rem);
        line-height: 1.1;
      }

      .subtitle {
        margin: 10px 0 16px;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .stat {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(143, 214, 255, 0.08);
      }

      .stat-label {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stat-value {
        display: block;
        margin-top: 6px;
        font-weight: 700;
        font-size: 1.05rem;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        color: #03131d;
        background: linear-gradient(135deg, var(--accent), #baf4ff);
        box-shadow: 0 8px 20px rgba(126, 231, 255, 0.35);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(126, 231, 255, 0.42);
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(3, 9, 15, 0.88);
        z-index: 2;
        text-align: center;
        padding: 40px;
      }

      .fallback.visible {
        display: grid;
      }

      .fallback-box {
        max-width: 420px;
        padding: 26px 22px;
        border: 1px solid rgba(143, 214, 255, 0.18);
        border-radius: 18px;
        background: rgba(11, 23, 35, 0.86);
      }

      .fallback-box h2 {
        margin-top: 0;
      }

      .fallback-box p {
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gpuCanvas"></canvas>

      <div class="hud">
        <p class="eyebrow">Depth vision</p>
        <h1>WebGPU Depth Sensing</h1>
        <p class="subtitle">
          Simulated depth map with live scanlines, edge contours, and volumetric shading.
        </p>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">Range</span>
            <span class="stat-value" id="depthRange">0.82m</span>
          </div>
          <div class="stat">
            <span class="stat-label">Focus</span>
            <span class="stat-value" id="focusValue">1.6x</span>
          </div>
          <div class="stat">
            <span class="stat-label">Scan</span>
            <span class="stat-value" id="scanValue">LIVE</span>
          </div>
        </div>

        <div class="controls">
          <button id="toggleMode" type="button">Toggle mode</button>
        </div>
      </div>

      <div id="fallback" class="fallback" aria-live="polite">
        <div class="fallback-box">
          <h2>WebGPU not available</h2>
          <p>
            This demo needs a browser with WebGPU enabled. Try the latest Chrome, Edge, or Safari version with WebGPU support.
          </p>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gpuCanvas');
      const fallback = document.getElementById('fallback');
      const toggleMode = document.getElementById('toggleMode');
      const depthRange = document.getElementById('depthRange');
      const focusValue = document.getElementById('focusValue');
      const scanValue = document.getElementById('scanValue');

      let modeIndex = 0;
      const modes = ['scan', 'surface', 'grid'];

      function updateHud(time) {
        const range = 0.68 + Math.sin(time * 0.9) * 0.14;
        const focus = 1.2 + Math.sin(time * 0.7) * 0.6;
        depthRange.textContent = `${range.toFixed(2)}m`;
        focusValue.textContent = `${focus.toFixed(1)}x`;
        scanValue.textContent = modes[modeIndex].toUpperCase();
      }

      toggleMode.addEventListener('click', () => {
        modeIndex = (modeIndex + 1) % modes.length;
      });

      async function initWebGPU() {
        if (!navigator.gpu) {
          fallback.classList.add('visible');
          return;
        }

        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          fallback.classList.add('visible');
          return;
        }

        const device = await adapter.requestDevice();
        const context = canvas.getContext('webgpu');
        const format = navigator.gpu.getPreferredCanvasFormat();

        const shaderSource = `
          struct Uniforms {
            time: f32,
            aspect: f32,
            mode: f32,
            scale: f32,
          };

          @group(0) @binding(0) var<uniform> uniforms: Uniforms;

          @vertex
          fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4f {
            var pos = array<vec2f, 3>(
              vec2f(-1.0, -1.0),
              vec2f(3.0, -1.0),
              vec2f(-1.0, 3.0)
            );
            return vec4f(pos[vertexIndex], 0.0, 1.0);
          }

          @fragment
          fn fs_main(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
            var resolution = vec2f(canvasDimensions().x, canvasDimensions().y);
            let uv = (fragCoord.xy - 0.5 * resolution.xy) / resolution.y;
            let t = uniforms.time;
            let mode = uniforms.mode;

            let radius = length(uv);
            let wave = sin((uv.x * 12.0 + t * 2.0) + uv.y * 9.0) * 0.5 + 0.5;
            let ripples = sin((uv.x * 22.0 - t * 3.2) * (1.0 + radius * 1.5)) * 0.5 + 0.5;
            let sweep = 0.5 + 0.5 * sin((uv.y * 10.0 + t * 1.5) + radius * 14.0);
            let contour = smoothstep(0.14, 0.0, abs(sin((uv.x * 18.0 + t * 1.5) + uv.y * 10.0) * 0.7 + radius));

            var depth = 1.0 - smoothstep(0.2, 1.2, radius + wave * 0.35 + ripples * 0.2 - 0.3);
            depth = clamp(depth + contour * 0.25 + sweep * 0.1, 0.0, 1.0);

            var base = mix(vec3f(0.02, 0.06, 0.12), vec3f(0.18, 0.58, 0.85), depth);
            var glow = mix(vec3f(0.15, 0.25, 0.38), vec3f(0.7, 0.93, 1.0), depth);

            if (mode < 0.5) {
              let scanline = 0.75 + 0.25 * sin((uv.y + t * 0.28) * 80.0);
              base = mix(base, vec3f(0.85, 0.97, 1.0), scanline * 0.32 * (1.0 - radius));
            } else if (mode < 1.5) {
              let top = smoothstep(0.2, 1.0, depth);
              base = mix(vec3f(0.02, 0.05, 0.12), vec3f(0.82, 0.95, 1.0), top);
              base += glow * 0.7 * smoothstep(0.8, 1.0, depth);
            } else {
              let grid = 0.8 - 0.7 * step(0.12, abs(fract((uv.x + uv.y * 0.7) * 12.0) - 0.5));
              base = mix(base, vec3f(0.05, 0.18, 0.45), grid * 0.5);
              base = mix(base, vec3f(0.95, 0.99, 1.0), contour * 0.9);
            }

            let vignette = 1.0 - smoothstep(1.2, 1.8, length(uv));
            let finalColor = base * vignette;
            return vec4f(finalColor, 1.0);
          }

          fn canvasDimensions() -> vec2f {
            return vec2f(1200.0, 760.0);
          }
        `;

        const shaderModule = device.createShaderModule({ code: shaderSource });

        const uniformBuffer = device.createBuffer({
          size: 16,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });

        const bindGroupLayout = device.createBindGroupLayout({
          entries: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: {} }],
        });

        const bindGroup = device.createBindGroup({
          layout: bindGroupLayout,
          entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
        });

        const pipeline = device.createRenderPipeline({
          layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
          vertex: {
            module: shaderModule,
            entryPoint: 'vs_main',
          },
          fragment: {
            module: shaderModule,
            entryPoint: 'fs_main',
            targets: [{ format }],
          },
          primitive: {
            topology: 'triangle-list',
          },
        });

        const resize = () => {
          const ratio = window.devicePixelRatio || 1;
          const width = Math.floor(canvas.clientWidth * ratio);
          const height = Math.floor(canvas.clientHeight * ratio);
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }
        };

        context.configure({
          device,
          format,
          alphaMode: 'premultiplied',
        });

        const render = (time) => {
          resize();
          updateHud(time * 0.001);

          const uniformData = new Float32Array([
            time * 0.001,
            canvas.width / Math.max(canvas.height, 1),
            modeIndex,
            1.0,
          ]);
          device.queue.writeBuffer(uniformBuffer, 0, uniformData);

          const encoder = device.createCommandEncoder();
          const pass = encoder.beginRenderPass({
            colorAttachments: [{
              view: context.getCurrentTexture().createView(),
              clearValue: { r: 0.03, g: 0.08, b: 0.12, a: 1.0 },
              loadOp: 'clear',
              storeOp: 'store',
            }],
          });

          pass.setPipeline(pipeline);
          pass.setBindGroup(0, bindGroup);
          pass.draw(3);
          pass.end();

          device.queue.submit([encoder.finish()]);
          requestAnimationFrame(render);
        };

        requestAnimationFrame(render);
      }

      initWebGPU();
    </script>
  </body>
</html>
